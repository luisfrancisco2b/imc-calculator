<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadore de IMC JS</title>
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">

    <script src="js/app.js" defer></script>
</head>

<body>

    <div class="container">

        <!-- Calc-Container -->
        <div id="calc-container" class="hide">
            <h2>Caluladora de IMC</h2>

            <!-- Form -->
            <form id="imc-form">

                <div class="form-inputs">
                    <!-- Altura -->
                    <div class="form-control">
                        <label for="height">Altura</label>
                        <input type="number" id="height" name="height" placeholder="Ex: 1,75" required>
                    </div>

                    <!-- Peso -->
                    <div class="form-control">
                        <label for="weight">Peso</label>
                        <input type="number" id="weight" name="weight" placeholder="Ex: 65" required>
                    </div>
                </div>


                <!-- Buttons -->
                <div class="action-control">
                    <button id="calc-btn">Calcular</button>
                    <button id="clear-btn">Limpar</button>
                </div>
            </form>
            <!-- Form -->

        </div>
        <!-- Calc-Container -->


        <!-- Result-Container -->
        <div id="result-container">
            <p id="imc-number">Seu IMC é: <span>25</span></p>
            <p id="imc-info">Situação atual: <span>Magreza</span></p>

            <h3>Confira as classificações: </h3>

            <!-- Table -->
            <div id="imc-table">

                <!-- Table Header -->
                <div class="table-header">
                    <h4>IMC</h4>
                    <h4>Classificação</h4>
                    <h4>Obesidade</h4>
                </div>

                <!-- Table Data -->
                <div class="table-data">
                    <p>Menor que 18,5</p>
                    <p>Magreza</p>
                    <p>0</p>
                </div>
            </div>

            <!-- Back Button -->
            <button id="back-btn">Voltar</button>
        </div>
        <!-- Result-Container -->
    </div>
</body>

</html>
